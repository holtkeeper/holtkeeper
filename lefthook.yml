pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,json,jsonc,md,yml,yaml}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx}'
      run: bunx oxlint --type-aware {staged_files}
    - name: typecheck
      glob: '*.{ts,tsx}'
      run: bunx tsc
