name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: docker/worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker.outputs.tags }}
          labels: ${{ steps.worker.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-worker:buildcache,mode=max
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

  deploy-branch:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: deploy-branch
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          if git fetch origin deploy && ! git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA"; then
            echo "deploy is already past $GITHUB_SHA"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/deploy"
