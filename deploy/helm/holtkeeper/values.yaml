# Holtkeeper chart. Every process runs the same image with `holtkeeper serve --role ...`.
nameOverride: ''
fullnameOverride: ''

image:
  repository: ghcr.io/holtkeeper/holtkeeper
  # Default: the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent
  pullSecrets: []

# HTTP port of every process (API on web, probes and /metrics on all of them).
port: 7420

config:
  # Content of holtkeeper.config.ts, mounted read-only at /app/config/holtkeeper.config.ts.
  # Empty: the chart's files/holtkeeper.config.ts (Postgres when HOLTKEEPER_DATABASE_URL is set,
  # S3 when HOLTKEEPER_S3_BUCKET is set, secrets from the environment).
  content: ''
  # Use this ConfigMap (key `holtkeeper.config.ts`) instead of rendering one.
  existingConfigMap: ''

# Secret whose keys become environment variables (HOLTKEEPER_VAULT_KEY, HOLTKEEPER_DATABASE_URL, ...).
existingSecret: ''
# Extra environment for every container, e.g. HOLTKEEPER_S3_BUCKET.
env: []
envFrom: []

podAnnotations: {}

serviceAccount:
  create: true
  name: ''
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  # Volumes that keep data (mirror cache, PVCs) are only re-owned when their root is not ours yet,
  # not file by file on every start.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# HOME is /tmp, so package manager and Go caches of dependency installs land here.
tmpSizeLimit: 8Gi

web:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  extraArgs: []
  terminationGracePeriodSeconds: 30
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts:
      - host: holtkeeper.example.com
        paths: ['/']
    tls: []
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 2
  # Jobs one pod runs at once. Default: jobs.concurrency from the config.
  concurrency: null
  # Exit after this many jobs, so the next ones get a fresh pod (see keda.scaledJob). 0: unlimited.
  maxJobs: 0
  # On SIGTERM running jobs get this long before they are requeued; keep below the grace period.
  drainTimeout: 120s
  terminationGracePeriodSeconds: 150
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }
  extraArgs: []
  workspace:
    sizeLimit: 20Gi
  # Bare git mirrors of analyzed repositories (/workspace/cache). `workspace`: inside the workspace
  # emptyDir, so a new pod clones every repository again. `pvc`: a volume kept across restarts;
  # ReadWriteMany (e.g. NFS) shares it between workers, which take a lock file per mirror.
  mirrorCache:
    type: workspace
    size: 50Gi
    storageClassName: ''
    accessModes: [ReadWriteMany]
    existingClaim: ''
  # Tools mise installs (Node, Go, ...): `emptyDir` per pod or a shared `pvc`.
  miseCache:
    type: emptyDir
    sizeLimit: 10Gi
    size: 20Gi
    storageClassName: ''
    accessModes: [ReadWriteMany]
    existingClaim: ''
  pdb:
    enabled: true
    maxUnavailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Several worker Deployments instead of one, e.g. per node class. Each pool is `worker` with its
  # own fields on top (replicas, concurrency, resources, nodeSelector, tolerations, affinity, ...),
  # named `<release>-worker-<name>` and labelled `holtkeeper.dev/worker-pool: <name>`.
  # `spread: true` places its pods on different nodes (at most one more on any node). Not with KEDA.
  #   pools:
  #     - { name: small, replicas: 3, concurrency: 2, spread: true }
  #     - { name: big, replicas: 1, concurrency: 4, nodeSelector: { kubernetes.io/hostname: big } }
  pools: []

# A separate scheduler Deployment. Disabled: the web pods run the scheduler under the same leader
# lease (only one of them acts at a time).
scheduler:
  enabled: false
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

keda:
  enabled: false
  # Prometheus that scrapes holtkeeper_jobs_queued (from the web pods).
  serverAddress: http://prometheus-operated.monitoring.svc:9090
  query: max(holtkeeper_jobs_queued{namespace="{{ .Release.Namespace }}"})
  # Queued jobs per worker replica.
  threshold: '2'
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  # One Kubernetes Job (one pod, `--max-jobs 1`) per queued job instead of a scaled Deployment.
  scaledJob:
    enabled: false
    maxReplicaCount: 20
    activeDeadlineSeconds: 7200

networkPolicy:
  enabled: false
  # Who may reach the web pods (the ingress controller); empty: anyone.
  webIngressFrom: []
  # Who may scrape /metrics of workers and schedulers (Prometheus); empty: nobody.
  metricsFrom: []
  # Egress of workers: forge, package registries, LLM APIs (HTTPS/SSH), DNS, database, object store.
  workerEgress:
    ports: [443, 80, 22]
    cidrs: ['0.0.0.0/0']
  # Where Postgres and the object store live, e.g. their pod selectors or CIDRs.
  extraEgress: []

# A forward proxy for the network traffic of job commands that adds credentials (registry tokens,
# ...) to matching requests, so jobs never hold them. Workers get HOLTKEEPER_EGRESS_PROXY and the
# proxy's CA certificate; the bundled config passes both to `jobs.execution.egress`. Any proxy that
# speaks HTTP CONNECT can replace it: set those two variables yourself and leave this disabled.
egressProxy:
  enabled: false
  image:
    repository: ghcr.io/holtkeeper/holtkeeper-egress-proxy
    # Default: image.tag, then the chart's appVersion.
    tag: ''
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  # Requests that get headers; values reference variables of `existingSecret` as ${NAME}.
  #   - host: gitlab.com            # or *.example.com
  #     paths: ['^/api/v4/(projects/[^/]+/|groups/[^/]+/-/)?packages/npm/']   # regex; empty: all
  #     methods: [GET, HEAD]        # the default
  #     headers: { Authorization: 'Bearer ${GITLAB_PACKAGES_TOKEN}' }
  #     insecure: false             # true: also over plain HTTP
  rules: []
  # Also read rules from Holtkeeper: panel GitLab forges ("Packages for jobs", on by default) get their token
  # added to package registry downloads, always the credential's current one. Web and proxy share
  # HOLTKEEPER_EGRESS_SECRET, which must be a key of the top-level `existingSecret`.
  forgeRules: true
  refreshSeconds: 60
  # Secret whose keys become the proxy's environment (the tokens the rules reference).
  existingSecret: ''
  # Hosts job commands reach directly, past the proxy.
  noProxy: []
  # Download cache of immutable archives: npm/yarn tarballs, Go modules, PyPI files, crates
  # ("packages"), Node.js, Go and GitHub release downloads ("tools"). A cached copy is served to
  # every job, also after upstream removed it or a forge lost access: see docs/deployment.md.
  cache:
    enabled: true
    # How long an entry survives without being used (s, m, h, d, w).
    ttl:
      packages: 28d
      tools: 21d
    # Above this, least recently used entries go first; keep it below the volume size.
    maxSize: 18Gi
    # Larger downloads pass through uncached.
    maxEntrySize: 4Gi
    # More cacheable URLs: { kind: packages|tools, host, paths: [regex], private: false }.
    # `private: true` also caches downloads the proxy added credentials to.
    rules: []
    # dir: a volume of the proxy pod (one per replica unless a ReadWriteMany pvc); s3: a bucket
    # every replica shares.
    backend: dir
    dir:
      type: emptyDir
      sizeLimit: 20Gi
      size: 20Gi
      storageClassName: ''
      accessModes: [ReadWriteOnce]
      existingClaim: ''
    s3:
      bucket: ''
      # Default: AWS for `region`. Path-style URLs, e.g. https://s3.example.com.
      endpoint: ''
      region: ''
      prefix: egress-cache
      # Secret with the access keys.
      existingSecret: ''
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
      # Downloads are spooled to an emptyDir of this size until complete, then uploaded.
      spoolSizeLimit: 8Gi
  ca:
    # A kubernetes.io/tls Secret (tls.crt, tls.key) with the CA the proxy signs intercepted TLS with.
    existingSecret: ''
    # Or let cert-manager issue a self-signed CA used only by this proxy (RSA, 10 years).
    certManager: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# More manifests rendered with the release, e.g. an ExternalSecret for `existingSecret` or a database.
extraObjects: []
