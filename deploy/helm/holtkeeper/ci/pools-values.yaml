worker:
  pools:
    - name: k3s
      replicas: 3
      concurrency: 2
      spread: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [k3s-1, k3s-2, k3s-3] }
    - name: core
      replicas: 1
      concurrency: 4
      nodeSelector: { kubernetes.io/hostname: core }
      tolerations: [{ key: dedicated, operator: Equal, value: nas, effect: NoSchedule }]
      resources:
        requests: { cpu: '1', memory: 2Gi }
        limits: { memory: 12Gi }
egressProxy:
  enabled: true
  ca:
    existingSecret: holtkeeper-egress-ca
