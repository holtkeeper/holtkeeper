{{- if .Values.egressProxy.enabled }}
{{- $ep := .Values.egressProxy }}
{{- $component := dict "ctx" $ "component" "egress-proxy" }}
{{- $name := printf "%s-egress-proxy" (include "holtkeeper.fullname" .) }}
{{- $cache := $ep.cache }}
{{- $rules := dict "rules" $ep.rules "cache" ($cache.enabled | ternary $cache.rules list) | toPrettyJson }}
{{- if and $cache.enabled (eq $cache.backend "s3") (not $cache.s3.bucket) }}
{{- fail "egressProxy.cache.backend s3 needs egressProxy.cache.s3.bucket" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
data:
  rules.json: {{ $rules | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ $ep.replicas }}
  selector:
    matchLabels:
      {{- include "holtkeeper.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "holtkeeper.selectorLabels" $component | nindent 8 }}
      annotations:
        checksum/rules: {{ $rules | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "holtkeeper.podSpecCommon" . | nindent 6 }}
      containers:
        - name: proxy
          image: {{ include "holtkeeper.egressProxyImage" . }}
          imagePullPolicy: {{ $ep.image.pullPolicy }}
          env:
            - name: EGRESS_PORT
              value: {{ $ep.port | quote }}
            - name: EGRESS_RULES
              value: /etc/egress/rules.json
            - name: EGRESS_CA_DIR
              value: /etc/egress/ca
            {{- if $cache.enabled }}
            - name: EGRESS_CACHE_TTL_PACKAGES
              value: {{ $cache.ttl.packages | quote }}
            - name: EGRESS_CACHE_TTL_TOOLS
              value: {{ $cache.ttl.tools | quote }}
            {{- with $cache.maxSize }}
            - name: EGRESS_CACHE_MAX_SIZE
              value: {{ . | quote }}
            {{- end }}
            - name: EGRESS_CACHE_MAX_ENTRY
              value: {{ $cache.maxEntrySize | quote }}
            {{- if eq $cache.backend "s3" }}
            - name: EGRESS_CACHE_S3_BUCKET
              value: {{ $cache.s3.bucket | quote }}
            {{- with $cache.s3.endpoint }}
            - name: EGRESS_CACHE_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $cache.s3.region }}
            - name: EGRESS_CACHE_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            - name: EGRESS_CACHE_S3_PREFIX
              value: {{ $cache.s3.prefix | quote }}
            - name: EGRESS_CACHE_SPOOL
              value: /spool
            {{- with $cache.s3.existingSecret }}
            - name: EGRESS_CACHE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: {{ $cache.s3.accessKeyIdKey }} }
            - name: EGRESS_CACHE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: {{ $cache.s3.secretAccessKeyKey }} }
            {{- end }}
            {{- else }}
            - name: EGRESS_CACHE_DIR
              value: /cache
            {{- end }}
            {{- with .Values.existingSecret }}
            - name: EGRESS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: HOLTKEEPER_EGRESS_SECRET
                  optional: true
            {{- end }}
            {{- else }}
            - name: EGRESS_CACHE
              value: "off"
            {{- end }}
            {{- if $ep.forgeRules }}
            {{- if not .Values.existingSecret }}
            {{- fail "egressProxy.forgeRules needs existingSecret with HOLTKEEPER_EGRESS_SECRET" }}
            {{- end }}
            - name: EGRESS_RULES_URL
              value: {{ printf "http://%s-web:%v/api/egress/rules" (include "holtkeeper.fullname" .) .Values.web.service.port | quote }}
            - name: EGRESS_RULES_REFRESH
              value: {{ $ep.refreshSeconds | quote }}
            - name: EGRESS_RULES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: HOLTKEEPER_EGRESS_SECRET
            {{- end }}
          {{- with $ep.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: proxy
              containerPort: {{ $ep.port }}
          readinessProbe:
            tcpSocket: { port: proxy }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: proxy }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $ep.resources | nindent 12 }}
          volumeMounts:
            - name: rules
              mountPath: /etc/egress/rules.json
              subPath: rules.json
              readOnly: true
            - name: ca
              mountPath: /etc/egress/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $cache.enabled }}
            {{- if eq $cache.backend "s3" }}
            - name: spool
              mountPath: /spool
            {{- else }}
            - name: cache
              mountPath: /cache
            {{- end }}
            {{- end }}
      volumes:
        - name: rules
          configMap:
            name: {{ $name }}
        - name: ca
          secret:
            secretName: {{ include "holtkeeper.egressCaSecret" . }}
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if $cache.enabled }}
        {{- if eq $cache.backend "s3" }}
        - name: spool
          emptyDir:
            sizeLimit: {{ $cache.s3.spoolSizeLimit }}
        {{- else if eq $cache.dir.type "pvc" }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-cache" $name) $cache.dir.existingClaim }}
        {{- else }}
        - name: cache
          emptyDir:
            sizeLimit: {{ $cache.dir.sizeLimit }}
        {{- end }}
        {{- end }}
      {{- include "holtkeeper.scheduling" $ep | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
spec:
  selector:
    {{- include "holtkeeper.selectorLabels" $component | nindent 4 }}
  ports:
    - name: proxy
      port: {{ $ep.port }}
      targetPort: proxy
{{- if and $cache.enabled (eq $cache.backend "dir") (eq $cache.dir.type "pvc") (not $cache.dir.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-cache
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $cache.dir.accessModes | nindent 4 }}
  {{- with $cache.dir.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $cache.dir.size }}
{{- end }}
{{- if and $ep.ca.certManager (not $ep.ca.existingSecret) }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-ca
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $name }} CA
  secretName: {{ include "holtkeeper.egressCaSecret" . }}
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  issuerRef:
    kind: Issuer
    name: {{ $name }}-selfsigned
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# The proxy accepts only workers (and web pods, for the cache overview) and reaches only DNS, the
# web pods (rules) and the worker egress ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "holtkeeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "holtkeeper.selectorLabels" $component | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: proxy
      from:
        - podSelector:
            matchLabels:
              {{- include "holtkeeper.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 14 }}
        {{- if $cache.enabled }}
        - podSelector:
            matchLabels:
              {{- include "holtkeeper.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
        {{- end }}
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if $ep.forgeRules }}
    - ports:
        - port: http
      to:
        - podSelector:
            matchLabels:
              {{- include "holtkeeper.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
    {{- end }}
    - ports:
        {{- range .Values.networkPolicy.workerEgress.ports }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
      to:
        {{- range .Values.networkPolicy.workerEgress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
