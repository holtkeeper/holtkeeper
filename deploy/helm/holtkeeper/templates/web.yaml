{{- $component := dict "ctx" $ "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holtkeeper.fullname" . }}-web
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
spec:
  {{- if not .Values.web.hpa.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "holtkeeper.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "holtkeeper.selectorLabels" $component | nindent 8 }}
      annotations:
        {{- include "holtkeeper.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "holtkeeper.podSpecCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      containers:
        - name: web
          image: {{ include "holtkeeper.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -c
            - /app/config/holtkeeper.config.ts
            - --role
            - {{ include "holtkeeper.webRoles" . }}
            {{- range .Values.web.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            {{- include "holtkeeper.env" . | nindent 12 }}
            {{- if and .Values.egressProxy.enabled .Values.egressProxy.cache.enabled }}
            - name: HOLTKEEPER_EGRESS_CACHE
              value: {{ printf "http://%s-egress-proxy:%v" (include "holtkeeper.fullname" .) .Values.egressProxy.port | quote }}
            {{- end }}
          {{- with (include "holtkeeper.envFrom" . | trim) }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          {{- include "holtkeeper.probes" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- include "holtkeeper.configMount" . | nindent 12 }}
            - name: data
              mountPath: /data
      volumes:
        {{- include "holtkeeper.configVolume" . | nindent 8 }}
        - name: data
          emptyDir: {}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "holtkeeper.fullname" . }}-web
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "holtkeeper.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
