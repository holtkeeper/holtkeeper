{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "holtkeeper.fullname" . }}-web
  labels:
    {{- include "holtkeeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "holtkeeper.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with $np.webIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and $np.webIngressFrom .Values.egressProxy.enabled .Values.egressProxy.forgeRules }}
    - ports:
        - port: http
      from:
        - podSelector:
            matchLabels:
              {{- include "holtkeeper.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 14 }}
    {{- end }}
---
# Workers and schedulers accept no traffic except metrics scrapes, and reach only DNS, the
# configured egress ports (forge, registries, LLM APIs) and `extraEgress` (database, object store).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "holtkeeper.fullname" . }}-worker
  labels:
    {{- include "holtkeeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [worker, scheduler]
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if $np.metricsFrom }}
    - ports:
        - port: http
      from:
        {{- toYaml $np.metricsFrom | nindent 8 }}
    {{- else }}
    []
    {{- end }}
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        {{- range $np.workerEgress.ports }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
      to:
        {{- range $np.workerEgress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- if .Values.egressProxy.enabled }}
    - ports:
        - { port: {{ .Values.egressProxy.port }}, protocol: TCP }
      to:
        - podSelector:
            matchLabels:
              {{- include "holtkeeper.selectorLabels" (dict "ctx" $ "component" "egress-proxy") | nindent 14 }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
