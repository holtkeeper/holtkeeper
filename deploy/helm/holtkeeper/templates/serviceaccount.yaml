{{- if .Values.serviceAccount.create }}
# No Role or RoleBinding: Holtkeeper never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "holtkeeper.serviceAccountName" . }}
  labels:
    {{- include "holtkeeper.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
