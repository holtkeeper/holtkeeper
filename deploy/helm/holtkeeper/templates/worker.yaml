{{- $component := dict "ctx" $ "component" "worker" }}
{{- if and .Values.worker.pools .Values.keda.enabled }}
{{- fail "worker.pools and keda.enabled do not combine: KEDA scales one worker Deployment" }}
{{- end }}
{{- if not (and .Values.keda.enabled .Values.keda.scaledJob.enabled) }}
{{- $pools := .Values.worker.pools | default (list (dict)) }}
{{- range $index, $pool := $pools }}
{{- $worker := include "holtkeeper.workerPool" (dict "ctx" $ "pool" $pool) | fromYaml }}
{{- $name := $pool.name | default "" }}
{{- $poolLabels := dict }}
{{- if $name }}{{- $poolLabels = dict "holtkeeper.dev/worker-pool" $name }}{{- end }}
{{- if $pool.spread }}
{{- $_ := set $worker "topologySpreadConstraints" (list (dict
  "maxSkew" 1
  "topologyKey" "kubernetes.io/hostname"
  "whenUnsatisfiable" "DoNotSchedule"
  "labelSelector" (dict "matchLabels" (merge (dict "holtkeeper.dev/worker-pool" $name) (include "holtkeeper.selectorLabels" $component | fromYaml)))
)) }}
{{- end }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holtkeeper.fullname" $ }}-worker{{ if $name }}-{{ $name }}{{ end }}
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
    {{- with $poolLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not $.Values.keda.enabled }}
  replicas: {{ $worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "holtkeeper.selectorLabels" $component | nindent 6 }}
      {{- with $poolLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "holtkeeper.selectorLabels" $component | nindent 8 }}
        {{- with $poolLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "holtkeeper.podAnnotations" $ | nindent 8 }}
    spec:
      {{- include "holtkeeper.podSpecCommon" $ | nindent 6 }}
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      containers:
        {{- include "holtkeeper.workerContainer" (dict "ctx" $ "worker" $worker "maxJobs" $worker.maxJobs) | nindent 8 }}
      volumes:
        {{- include "holtkeeper.workerVolumes" $ | nindent 8 }}
      {{- include "holtkeeper.scheduling" $worker | nindent 6 }}
{{- end }}
{{- end }}
---
# Probes and /metrics of the workers; no API is served here.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "holtkeeper.fullname" . }}-worker
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "holtkeeper.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- if and (eq .Values.worker.mirrorCache.type "pvc") (not .Values.worker.mirrorCache.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "holtkeeper.fullname" . }}-mirrors
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.worker.mirrorCache.accessModes | nindent 4 }}
  {{- with .Values.worker.mirrorCache.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.worker.mirrorCache.size }}
{{- end }}
{{- if and (eq .Values.worker.miseCache.type "pvc") (not .Values.worker.miseCache.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "holtkeeper.fullname" . }}-mise
  labels:
    {{- include "holtkeeper.componentLabels" $component | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.worker.miseCache.accessModes | nindent 4 }}
  {{- with .Values.worker.miseCache.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.worker.miseCache.size }}
{{- end }}
